// Apply fixes for React Native Android build issues

// Fix for AsyncStorage and other modules that might have naming issues
gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        if (project.name.contains('react-native-async-storage_async-storage')) {
            // Skip this incorrectly named project
            project.tasks.all { task ->
                task.enabled = false
            }
        }
    }
}

// Add build configuration fixes
allprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                // Suppress compile SDK warnings
                if (!project.hasProperty('android.suppressUnsupportedCompileSdk')) {
                    project.ext['android.suppressUnsupportedCompileSdk'] = '34'
                }
                
                // Ensure buildConfig is enabled where needed
                if (project.name.contains('datetimepicker') || 
                    project.name.contains('async-storage')) {
                    buildFeatures {
                        buildConfig true
                    }
                }
            }
        }
    }
}
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'ProductivityApp'

// First, wrap the original include method to filter out AsyncStorage
def originalInclude = settings.&include
settings.metaClass.include = { String... paths ->
    def filteredPaths = paths.findAll { path ->
        boolean shouldInclude = !path.toLowerCase().contains('async-storage') && 
                               !path.toLowerCase().contains('asyncstorage')
        if (!shouldInclude) {
            println "[SETTINGS] Blocking include: $path"
        }
        return shouldInclude
    }
    if (filteredPaths.size() > 0) {
        originalInclude(*filteredPaths)
    }
}

// Include app module
include ':app'

def nodeModulesDir = new File(rootDir.parentFile, 'node_modules')

if (nodeModulesDir.exists()) {
    println "[SETTINGS] node_modules found, applying autolinking..."
    
    // Apply React Native CLI autolinking
    def cliPlatformAndroid = new File(nodeModulesDir, '@react-native-community/cli-platform-android/native_modules.gradle')
    if (cliPlatformAndroid.exists()) {
        println "[SETTINGS] Applying React Native CLI autolinking..."
        apply from: cliPlatformAndroid
        applyNativeModulesSettingsGradle(settings)
    }
    
    // Apply Expo autolinking
    def expoAutolinking = new File(nodeModulesDir, 'expo/scripts/autolinking.gradle')
    if (expoAutolinking.exists()) {
        println "[SETTINGS] Applying Expo autolinking..."
        apply from: expoAutolinking
        useExpoModules()
    }
} else {
    println "[SETTINGS] node_modules not found, skipping autolinking"
}

// Post-process to ensure AsyncStorage is removed
println "[SETTINGS] Post-autolinking cleanup..."

// Get all included projects and filter out AsyncStorage
def blockedIncludes = []
rootProject.children.each { project ->
    if (project.name.toLowerCase().contains('async-storage') || 
        project.name.toLowerCase().contains('asyncstorage')) {
        blockedIncludes.add(project.name)
    }
}

// Remove blocked projects
blockedIncludes.each { projectName ->
    println "[SETTINGS] Removing project: $projectName"
    def projectToRemove = rootProject.children.find { it.name == projectName }
    if (projectToRemove) {
        rootProject.children.remove(projectToRemove)
    }
}

println "[SETTINGS] Final project count: ${rootProject.children.size()}"
rootProject.children.each { project ->
    println "[SETTINGS] Project: ${project.name}"
}
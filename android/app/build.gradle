apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// React Native 0.74.5 configuration
// Using minimal setup for EAS Build compatibility

// Apply native modules configuration if available
def nativeModulesGradle = file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (nativeModulesGradle.exists()) {
    apply from: nativeModulesGradle
    applyNativeModulesAppBuildGradle(project)
}

// Apply post-autolinking cleanup
apply from: "../gradle/post-autolinking-cleanup.gradle"

// Apply Android build fixes for React Native libraries
def androidFixesGradle = file("../../patches/apply-fixes.gradle")
if (androidFixesGradle.exists()) {
    apply from: androidFixesGradle
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Whether to enable the Hermes JS engine.
 * Hermes is an open-source JavaScript engine optimized for React Native.
 * For more information visit https://reactnative.dev/docs/hermes
 */
def hermesEnabled = project.hasProperty('hermesEnabled') && project.hermesEnabled == 'true'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.productivityapp"
    defaultConfig {
        applicationId "com.productivityapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// Configure dependency resolution to exclude AsyncStorage
configurations.all {
    resolutionStrategy {
        // Force exclude AsyncStorage from all configurations
        exclude group: 'com.reactnativecommunity', module: 'async-storage'
        exclude group: 'com.reactnativecommunity', module: 'react-native-async-storage'
        
        // If any dependency requires AsyncStorage, fail the build with a clear message
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.name.contains('async-storage') || 
                details.requested.module.contains('async-storage')) {
                println "WARNING: Dependency ${details.requested} is trying to include AsyncStorage"
                details.useVersion '0.0.0' // Force a non-existent version to fail
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // Explicitly exclude AsyncStorage from all dependencies
    implementation("com.facebook.react:react-android") {
        exclude group: 'com.reactnativecommunity', module: 'async-storage'
    }
}
